# --- Reboot -----------------------------------------------------------------
reboot.title:
  es: Hay que reiniciar Windows
  en: Windows needs to restart
reboot.sub:
  es: WSL ya quedó instalado. Al volver a entrar, el instalador se abre solo y termina de configurar la distro.
  en: WSL is installed. When you sign back in, the installer opens by itself and finishes setting up the distro.
