# --- Install WSL / a distro -------------------------------------------------
install_wsl.title_new:
  es: WSL no está instalado
  en: WSL isn't installed
install_wsl.sub_new:
  es: Lo instalo junto con una distro. Windows pide permiso de administrador y hay que reiniciar una vez; después el instalador sigue solo.
  en: I'll install it with a distro. Windows asks for administrator permission and one restart; then the installer carries on by itself.
install_wsl.button_new:
  es: Instalar WSL
  en: Install WSL
install_wsl.title_distro:
  es: WSL no tiene distros
  en: WSL has no distros
install_wsl.sub_distro:
  es: WSL ya está instalado, pero no hay ninguna distro. Elige cuál instalar.
  en: WSL is installed, but there are no distros. Pick one to install.
install_wsl.title_add:
  es: Instalar otra distro
  en: Install another distro
install_wsl.sub_add:
  es: Se agrega junto a las que ya tienes.
  en: It's added next to the ones you have.
install_wsl.button_distro:
  es: Instalar distro
  en: Install distro

# --- Linux user -------------------------------------------------------------
user.title:
  es: Usuario de Linux
  en: Linux user
user.sub:
  es: Es el usuario de la distro nueva. No tiene que ser igual al de Windows.
  en: The new distro's user. It doesn't have to match your Windows one.
user.sub_resume:
  es: Escribe otra vez la contraseña para terminar de crear el usuario.
  en: Type the password again to finish creating the user.
user.name:
  es: Usuario
  en: Username
user.password:
  es: Contraseña
  en: Password
user.repeat:
  es: Repetir
  en: Repeat
user.error_name:
  es: Usa minúsculas, números, guion o guion bajo, empezando con una letra.
  en: Use lowercase letters, digits, hyphen or underscore, starting with a letter.
user.error_mismatch:
  es: Las contraseñas no coinciden.
  en: The passwords don't match.

# --- Virtualization off -----------------------------------------------------
novirt.title:
  es: La virtualización está apagada
  en: Virtualization is turned off
novirt.sub:
  es: WSL la necesita. Actívala en la BIOS (Intel VT-x o AMD SVM) y vuelve a abrir el instalador. Mientras tanto puedes instalar con base Windows.
  en: WSL needs it. Turn it on in the BIOS (Intel VT-x or AMD SVM) and open the installer again. Meanwhile you can install with Windows as the base.
novirt.use_windows:
  es: Seguir con Windows
  en: Continue with Windows

