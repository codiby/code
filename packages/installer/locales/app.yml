# --- Base -------------------------------------------------------------------
base.title:
  es: ¿Dónde corre Codiby?
  en: Where does Codiby run?
base.sub:
  es: El host base guarda tus sesiones y ejecuta a los agentes.
  en: The base host keeps your sessions and runs the agents.
base.windows:
  es: Windows
  en: Windows
base.windows_sub:
  es: Lo normal. Puedes agregar distros de WSL como hosts.
  en: The usual choice. You can add WSL distros as hosts.
base.wsl:
  es: WSL
  en: WSL
base.wsl_sub:
  es: Herramientas de Linux. Los hosts SSH funcionan.
  en: Linux tools. SSH hosts work.
base.pill_install_wsl:
  es: se instala WSL
  en: installs WSL
base.pill_install_distro:
  es: se instala una distro
  en: installs a distro
base.pill_unavailable:
  es: no disponible
  en: unavailable
base.note_install_wsl:
  es: Se instala WSL. Windows pide permiso de administrador y hay que reiniciar una vez.
  en: WSL gets installed. Windows asks for administrator permission and one restart.
base.note_novirt:
  es: WSL no está disponible porque la virtualización está apagada. Puedes activarla después y volver a correr el instalador.
  en: WSL isn't available because virtualization is turned off. You can turn it on later and run the installer again.

# --- Hosts (Windows base) ---------------------------------------------------
hosts.title:
  es: Agregar WSL como host
  en: Add WSL as a host
hosts.sub:
  es: Codiby podrá abrir sesiones dentro de estas distros.
  en: Codiby will be able to open sessions inside these distros.
hosts.install_new:
