[package]
name = "codiby-code"
version = "0.0.5"
description = "Codiby Code"
authors = ["you"]
edition = "2021"
# `codiby-code` is the GUI app that `tauri dev`/`tauri build` drives. The second
# binary `codiby-code-service` is the Windows Service wrapper — installed
# separately via `scripts/install-service.ps1`, never spawned by the Tauri CLI.
# Without `default-run`, cargo refuses to pick one for `cargo run` (used
# internally by `tauri dev`).
default-run = "codiby-code"

[lib]
name = "codiby_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codiby-code"
path = "src/main.rs"

# Windows-only native service wrapper for the bridge server. Cross-compiles as a
# no-op stub on other platforms so `cargo check` works everywhere.
[[bin]]
name = "codiby-code-service"
path = "src/bin/codiby-code-service.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.3.3"
url = "2"
tokio = { version = "1", features = ["time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
