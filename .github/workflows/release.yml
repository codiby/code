name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g. v0.6.0)"
        required: true
        type: string

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      # Skip auto cert discovery so the build doesn't fail looking for a
      # local Developer ID keychain entry that doesn't exist on the
      # runner. When the repo gets signing secrets (CSC_LINK +
      # CSC_KEY_PASSWORD), flip this to "true".
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Pull just this version's section out of CHANGELOG.md so the release
      # body renders as proper Markdown (### Added / ### Changed headings,
      # bullets, bold) on the GitHub release page — instead of falling back
      # to a generic "built from vX.Y.Z" line. Tag annotation is plain text
      # by git convention; the release body is where Markdown lives.
      - name: Extract changelog section for this release
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          {
            echo 'body<<__CHANGELOG_EOF__'
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \[/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo '---'
            echo
            echo "**macOS (Apple Silicon)**: \`Codiby Code-*-arm64.dmg\`"
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      # Pipeline:
      #   1. frontend dist/ via bun build
      #   2. bun runtime + bundled server.js into electron/resources/
      #   3. tsc electron/ → electron-dist/
      #   4. electron-builder packages .app + .dmg under electron-out/
      # Notarisation auto-skips when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
      # / APPLE_TEAM_ID secrets are missing — the dmg ships ad-hoc signed.
      - name: Build frontend
        run: bun run build-server

      - name: Bundle bun + server.js resources
        run: bun run electron:bundle-resources

      - name: Compile electron main
        run: bun run electron:build:main

      - name: Package with electron-builder (mac dmg, arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx electron-builder --mac dmg --arm64

      - name: List build artifacts
        run: ls -lh electron-out/

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Codiby Code ${{ steps.tag.outputs.name }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: |
            electron-out/Codiby Code-*-arm64.dmg
            electron-out/Codiby Code-*-arm64.dmg.blockmap
