name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g. v0.6.0)"
        required: true
        type: string

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build-server

      - name: Bundle bun + server.js resources
        run: bun run electron:bundle-resources

      - name: Compile electron main
        run: bun run electron:build:main

      - name: Package with electron-builder (mac dmg, arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx electron-builder --mac dmg --arm64 --publish never

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp electron-out/*.dmg release-artifacts/
          cp electron-out/*.dmg.blockmap release-artifacts/
          cp electron-out/latest-mac.yml release-artifacts/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-artifacts/

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build-server

      - name: Bundle bun + server.js resources
        run: bun run electron:bundle-resources

      - name: Compile electron main
        run: bun run electron:build:main

      - name: Package with electron-builder (win nsis)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win nsis --publish never

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp electron-out/*.exe release-artifacts/
          cp electron-out/*.exe.blockmap release-artifacts/ 2>/dev/null || true
          cp electron-out/latest.yml release-artifacts/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-artifacts/

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this release
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          {
            echo 'body<<__CHANGELOG_EOF__'
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \[/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo '---'
            echo
            echo "**macOS (Apple Silicon)**: \`Codiby Code-*-arm64.dmg\`"
            echo "**Windows (x64)**: \`Codiby Code Setup *.exe\`"
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR artifacts/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Codiby Code ${{ steps.tag.outputs.name }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: artifacts/*
